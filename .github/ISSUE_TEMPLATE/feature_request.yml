name: Feature request
description: Suggest an improvement to Sortlane.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: Describe the workflow and any alternatives you considered.
    validations:
      required: true
