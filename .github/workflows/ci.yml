name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS · tests and release packages
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run safety and rules tests
        run: swift test
      - name: Build native app target
        run: >-
          xcodebuild -project Sortlane.xcodeproj -scheme Sortlane
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          -derivedDataPath .build/Xcode -skipPackageUpdates
          -disableAutomaticPackageResolution build
      - name: Verify native app branding
        run: |
          native_app=.build/Xcode/Build/Products/Debug/Sortlane.app
          cmp Resources/AppIcon.icns "$native_app/Contents/Resources/AppIcon.icns"
          cmp Resources/Brand/SortlaneLogo.png "$native_app/Contents/Resources/SortlaneLogo.png"
      - name: Build and verify release packages
        run: bash scripts/package-release.sh
      - name: Retain release packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sortlane-macos-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 7
