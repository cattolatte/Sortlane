<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Sortlane — a little more order for your Mac</title>
  <desc id="description">An indigo and ivory wordmark on a dark navy background, with documents flowing into neatly arranged category folders.</desc>
